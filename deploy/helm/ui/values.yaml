image:
  repository: quay.io/rh-ee-lbitan/metric-ui
  tag: metric-ui-3.0.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8501

# OpenShift Route (only for OpenShift clusters)
route:
  enabled: false
  host: ""
  tls:
    enabled: true

# Kubernetes Ingress (for minikube/standard Kubernetes)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: observability-ui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  PROMETHEUS_URL: "http://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
  LLM_URL: "http://llm-service:8012"
  LLM_API_TOKEN: ""
  MCP_API_URL: "http://metric-mcp-svc.{{ .Release.Namespace }}.svc.cluster.local:8000"
